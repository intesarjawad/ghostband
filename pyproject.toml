[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "ghostband_build"
backend-path = ["packaging"]
[tool.uv.build-backend]
module-name = "ghostband"
module-root = "conductor"
source-include = ["packaging/ghostband_build.py"]
[project]
name = "ghostband"
description = "Your chord chart, played by an experimental backing band on your Mac."
version = "0.1.0"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = ["aiohttp~=3.14.5", "pydantic~=2.14.3", "numpy~=2.5.4", "soundfile~=0.14.0", "mido~=1.3.3", "click~=8.5.0", "librosa~=1.0.0", "mir_eval~=0.8.2", "scipy~=1.18.1"]
[project.scripts]
ghostband = "ghostband.cli:main"
[dependency-groups]
dev = ["ruff==0.17.4", "pyright==1.1.414", "pytest==9.2.0", "hypothesis~=6.170", "pre-commit==4.7.0"]
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["third_party"]
[tool.ruff.lint]
select = ["E","F","W","I","N","UP","B","A","C4","SIM","PL","RUF","ANN","PT","ARG","TC","PERF","S","DTZ","PTH"]
ignore = ["PLR2004"]
[tool.ruff.lint.per-file-ignores]
"conductor/tests/**" = ["S101"]
[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["conductor", "scripts"]
# These resources run under their own Python 3.11 projects and type-checker configs.
exclude = ["conductor/ghostband/extract_envs"]
[tool.pytest.ini_options]
testpaths = ["conductor/tests"]
markers = ["models: needs downloaded models; run by make gate, skipped in CI"]

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
