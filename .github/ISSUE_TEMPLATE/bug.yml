name: Bug report
description: Report a reproducible problem.
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the version, macOS version, steps and expected and actual behaviour. Exclude recordings and private data.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Include relevant error messages without secrets or personal paths.
