[project]
name = "ghostband-extract-sheetsage2"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.8.0",
  "torchaudio==2.8.0",
  "transformers==4.45.2",
  "huggingface-hub==0.36.0",
  "safetensors==0.5.3",
  "numpy==1.24.3",
  "scipy==1.13.1",
  "mir_eval==0.8.2",
  "pretty_midi==0.2.10",
  "mido==1.3.3",
  "setuptools==78.1.1",
  "soundfile",
]

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[dependency-groups]
dev = ["pyright==1.1.414"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"
include = ["*.py"]
reportMissingTypeStubs = false
